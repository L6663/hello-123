name: Stage 8 Productization CI

on:
  pull_request:
    branches:
      - develop/v6-literary-engine
  workflow_dispatch:

concurrency:
  group: stage8-productization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_DATE_EPOCH: "1700000000"

jobs:
  restore-r7-public-source:
    name: Restore R7 public source
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/v6-stage8-r7-learning-integration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v6-stage8-r7-learning-integration
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reassemble and verify public patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .r7-public-patch.part00 \
            .r7-public-patch.part01 \
            .r7-public-patch.part02a \
            .r7-public-patch.part02b \
            .r7-public-patch.part03a \
            .r7-public-patch.part03b \
            > /tmp/r7-public.patch.xz
          echo '5689b0546dff337b4d2904e79f966f181e30e29f346c2c62783e6198e934fd26  /tmp/r7-public.patch.xz' | sha256sum -c -
          xz -dc /tmp/r7-public.patch.xz > /tmp/r7-public.patch
          echo 'c1b80e36248a8fdbdc3ee8b2232de93e3b79b778ff63d328b3da71a6dec1ae27  /tmp/r7-public.patch' | sha256sum -c -
          git apply --check \
            --exclude='text_knowledge_reader_core.egg-info/SOURCES.txt' \
            --exclude='text_knowledge_reader_core.egg-info/entry_points.txt' \
            /tmp/r7-public.patch
          git apply \
            --exclude='text_knowledge_reader_core.egg-info/SOURCES.txt' \
            --exclude='text_knowledge_reader_core.egg-info/entry_points.txt' \
            /tmp/r7-public.patch

      - name: Enforce public-only boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '(^|/)(chapter-source-packets\.jsonl|model-learning-observations\.jsonl|private.*\.(txt|zip|jsonl)|gold.*\.(json|jsonl|txt)|blind.*observations)' ; then
            echo 'Forbidden private runtime artifact path detected.' >&2
            exit 1
          fi
          if grep -RIlE '蛊真人|步剑庭|逆天邪神|万古神帝' \
              README.md SKILL.md PROJECT_STATUS.yaml docs schemas scripts status tests tkr pyproject.toml \
              | grep . ; then
            echo 'Private novel-title literal detected.' >&2
            exit 1
          fi

      - name: Reconcile public integration manifests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          updates = {
              Path('status/STAGE8_R7_INTEGRATION_MANIFEST.yaml'): [
                  ('status: public_integration_manifest_created_implementation_not_yet_integrated',
                   'status: public_r7_implementation_restored_exact_github_ci_pending'),
                  ('github_implementation_integrated: false',
                   'github_implementation_integrated: true'),
                  ('next_action: restore_public_r7_implementation_and_synthetic_tests_to_this_branch_then_run_exact_github_ci',
                   'next_action: run_exact_github_ci_review_public_diff_then_merge_if_all_gates_pass'),
              ],
              Path('status/STAGE8_R7_PUBLIC_SOURCE_EVIDENCE.yaml'): [
                  ('status: local_public_source_candidate_inventoried_exact_github_implementation_ci_pending',
                   'status: public_r7_source_restored_exact_github_ci_pending'),
                  ('restore_key_public_files_to_branch: true',
                   'restore_key_public_files_to_branch: false'),
                  ('next_action: restore_public_r7_source_files_and_synthetic_tests_then_run_exact_ci_on_the_resulting_head',
                   'next_action: run_exact_github_ci_review_public_diff_then_merge_if_all_gates_pass'),
              ],
          }
          for path, replacements in updates.items():
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'missing expected manifest text in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Focused public R7 verification
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m compileall -q tkr scripts tests
          python -m unittest \
            tests.test_learning_cli \
            tests.test_learning_engine \
            tests.test_learning_r7_capabilities \
            tests.test_stage8_r6_encoding_contract

      - name: Commit restored public implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin develop/v6-literary-engine
          git checkout origin/develop/v6-literary-engine -- .github/workflows/stage1-evidence.yml
          rm -f \
            .r7-public-patch.part00 \
            .r7-public-patch.part01 \
            .r7-public-patch.part02a \
            .r7-public-patch.part02b \
            .r7-public-patch.part03a \
            .r7-public-patch.part03b \
            .github/workflows/apply-r7-public-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'restore R7 public implementation and synthetic tests'
          git push origin HEAD:feature/v6-stage8-r7-learning-integration

  package-matrix:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Compile Stage 8 runtime
        run: |
          python -m py_compile \
            scripts/tkr.py \
            tkr/final_acceptance.py \
            tkr/final_acceptance_cli.py \
            tkr/literary_benchmark.py \
            tkr/skill_audit.py

      - name: Validate public schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          names = [
              "literary-benchmark-case.schema.json",
              "literary-benchmark-observation.schema.json",
              "literary-benchmark-report.schema.json",
              "literary-benchmark-verification.schema.json",
              "private-blind-attestation.schema.json",
              "package-acceptance-v2.schema.json",
              "engineering-validation.schema.json",
              "reproducible-build-v2.schema.json",
              "final-acceptance-candidate.schema.json",
              "final-acceptance-approval.schema.json",
              "final-acceptance-seal.schema.json",
              "final-acceptance-verification.schema.json",
          ]
          for name in names:
              payload = json.loads((Path("schemas") / name).read_text(encoding="utf-8"))
              assert payload["$schema"].endswith("2020-12/schema")
              assert payload["type"] == "object"
          PY

      - name: Stage 8 focused regressions
        run: python -m unittest tests.test_final_acceptance -v

      - name: Complete repository regression
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Source Skill audit and doctor
        run: |
          python scripts/tkr.py audit --root . --output skill-audit-source.json
          python scripts/tkr.py doctor --root . --output skill-doctor-source.json
          python - <<'PY'
          import json
          for name in ("skill-audit-source.json", "skill-doctor-source.json"):
              payload = json.load(open(name, encoding="utf-8"))
              assert payload["passed"] is True
              assert payload["audit_version"] == "6.0.0-stage8"
          PY

      - name: Build canonical Wheel
        run: python -m build --wheel --outdir dist

      - name: Clean Wheel installation
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --upgrade pip
          .venv-wheel/bin/python -m pip install dist/*.whl
          .venv-wheel/bin/python - <<'PY'
          import tkr
          assert tkr.__version__ == "6.0.0rc1"
          PY

      - name: Installed Skill audit and command contract
        run: |
          .venv-wheel/bin/tkr-skill audit --output skill-audit-installed.json
          .venv-wheel/bin/tkr-skill doctor --output skill-doctor-installed.json
          .venv-wheel/bin/tkr-project --help >/dev/null
          .venv-wheel/bin/tkr-literary --help >/dev/null
          .venv-wheel/bin/tkr-evidence --help >/dev/null
          .venv-wheel/bin/tkr-chapter --help >/dev/null
          .venv-wheel/bin/tkr-event --help >/dev/null
          .venv-wheel/bin/tkr-character --help >/dev/null
          .venv-wheel/bin/tkr-reason --help >/dev/null
          .venv-wheel/bin/tkr-notion --help >/dev/null
          .venv-wheel/bin/tkr-literary-benchmark --help >/dev/null
          .venv-wheel/bin/tkr-final-acceptance --help >/dev/null
          .venv-wheel/bin/tkr-final-acceptance prepare --help >/dev/null
          .venv-wheel/bin/tkr-final-acceptance verify --help >/dev/null
          .venv-wheel/bin/tkr-final-acceptance seal --help >/dev/null
          .venv-wheel/bin/tkr-final-acceptance verify-seal --help >/dev/null
          python - <<'PY'
          import json
          for name in ("skill-audit-installed.json", "skill-doctor-installed.json"):
              payload = json.load(open(name, encoding="utf-8"))
              assert payload["passed"] is True
              assert payload["audit_version"] == "6.0.0-stage8"
              assert payload["project_acceptance_performed"] is False
              assert payload["release_candidate"] is False
              assert payload["may_freeze"] is False
          PY

      - name: Bundled Skill command contract
        run: |
          python scripts/tkr.py acceptance --help >/dev/null
          python scripts/tkr.py acceptance-prepare --help >/dev/null
          python scripts/tkr.py acceptance-verify --help >/dev/null
          python scripts/tkr.py acceptance-seal --help >/dev/null
          python scripts/tkr.py acceptance-verify-seal --help >/dev/null

  reproducible-wheel:
    name: Reproducible Wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build twice from the same source epoch
        run: |
          python -m build --wheel --outdir dist-a
          rm -rf build text_knowledge_reader_core.egg-info
          python -m build --wheel --outdir dist-b

      - name: Require byte-identical Wheels
        run: |
          WHEEL_A=$(find dist-a -maxdepth 1 -name '*.whl' -print -quit)
          WHEEL_B=$(find dist-b -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$WHEEL_A"
          test -n "$WHEEL_B"
          test "$(basename "$WHEEL_A")" = "$(basename "$WHEEL_B")"
          cmp --silent "$WHEEL_A" "$WHEEL_B"
          sha256sum "$WHEEL_A" "$WHEEL_B"

      - name: Require packaged Stage 8 assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist-a").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required_suffixes = {
              "share/text-knowledge-reader/SKILL.md",
              "share/text-knowledge-reader/README.md",
              "share/text-knowledge-reader/PROJECT_STATUS.yaml",
              "share/text-knowledge-reader/schemas/final-acceptance-candidate.schema.json",
              "share/text-knowledge-reader/schemas/private-blind-attestation.schema.json",
              "share/text-knowledge-reader/docs/STAGE8_FINAL_PRODUCTIZATION_ACCEPTANCE.md",
          }
          missing = sorted(
              suffix for suffix in required_suffixes
              if not any(name.endswith(suffix) for name in names)
          )
          assert not missing, missing
          PY
